<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA الإدارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 class="brand-title"><span class="brand-sa">SA</span> <span class="brand-name">الإدارة</span></h1>
      <p class="muted" id="last-build"></p>
    </div>
    <nav class="tabs" aria-label="الأقسام">
      <button class="tab is-active" data-tab="overview">نظرة عامة</button>
      <button class="tab" data-tab="reports">التقارير اليومية</button>
      <button class="tab" data-tab="finance">الإيرادات</button>
      <button class="tab" data-tab="employees">الموظفين</button>
      <button class="tab" data-tab="projects">المشاريع</button>
      <button class="tab" data-tab="news">أخبار تويتر</button>
    </nav>
  </header>

  <main>
    <!-- نظرة عامة -->
    <section id="tab-overview" class="panel is-active">
      <div class="kpis" id="kpis"></div>

      <div class="card open-points">
        <h2>أهم النقاط المفتوحة</h2>
        <ul class="list">
          <li>بناء موقع SA الإدارة</li>
          <li>التحديث اليومي الساعة ١٢ بليل</li>
          <li>إضافة الإيرادات الشهرية</li>
        </ul>
      </div>

      <div class="grid-2">
        <div class="card">
          <h2>يحتاج قرار منك</h2>
          <ul class="list" id="needs-decision"></ul>
        </div>
      </div>
    </section>

    <!-- التقارير -->
    <section id="tab-reports" class="panel">
      <div class="toolbar">
        <label>اليوم
          <select id="date-select"></select>
        </label>
        <label>الموظف
          <select id="emp-select"><option value="">الكل</option></select>
        </label>
        <label class="check">
          <input type="checkbox" id="only-work"> الشغل المنجز فقط
        </label>
      </div>
      <p class="muted" id="report-count"></p>
      <div class="cards" id="report-cards"></div>
    </section>

    <!-- الإيرادات -->
    <section id="tab-finance" class="panel">
      <div id="finance-body"></div>
    </section>

    <!-- الموظفين -->
    <section id="tab-employees" class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>الموظف</th><th>المسمى</th><th>المشرف</th><th>الحالة</th></tr>
          </thead>
          <tbody id="employees-body"></tbody>
        </table>
      </div>
    </section>

    <!-- المشاريع -->
    <section id="tab-projects" class="panel">
      <div class="cards" id="project-cards"></div>
    </section>
    <!-- أخبار تويتر: شات بأسلوب واتساب -->
    <section id="tab-news" class="panel">
      <div class="wa">
        <div class="wa-head">
          <div class="wa-avatar" aria-hidden="true">أ</div>
          <div class="wa-title">
            <strong>راصد الأخبار</strong>
            <span id="wa-sub">محلل سياسي (ذكاء اصطناعي) · مصادره من بحث الويب</span>
          </div>
        </div>
        <div class="wa-note" id="wa-note"></div>
        <div class="wa-body" id="wa-body" aria-live="polite"></div>
        <div class="wa-chips" id="wa-chips"></div>
        <form class="wa-form" id="wa-form">
          <input id="wa-input" type="text" placeholder="اسأله عن الحرب أو اطلب تحليل..." autocomplete="off" aria-label="رسالتك">
          <button type="submit" id="wa-send" class="wa-send">إرسال</button>
          <button type="button" id="wa-stop" class="wa-stop" hidden>إيقاف</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="foot muted">
    بيانات المؤسسة · يتحدث يومياً
  </footer>

  <script src="data/site-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
