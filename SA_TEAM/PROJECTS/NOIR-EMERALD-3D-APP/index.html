/* hero */

.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;touch-action:pan-y;cursor:grab;

var NE={labelMats:[]};

  x.fillStyle=g;x.fillRect(0,0,1024,512);

  box(70,70,34,330,"#e8e8e8",20);

};
NE.mats=function(){return{
  glass:new THREE.MeshPhysicalMaterial({color:0x040404,metalness:0,roughness:.03,clearcoat:1,clearcoatRoughness:.02,envMapIntensity:.85}),
  ink:new THREE.MeshStandardMaterial({color:0x020202,metalness:0,roughness:.25,envMapIntensity:.3}),
  panel:new THREE.MeshStandardMaterial({color:0x060606,metalness:.05,roughness:.8,envMapIntensity:.25}),
  cap:new THREE.MeshPhysicalMaterial({color:0x050506,metalness:.3,roughness:.1,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.6}),
  gold:new THREE.MeshStandardMaterial({color:0xcdb07a,metalness:1,roughness:.16,envMapIntensity:1.7}),
  goldSoft:new THREE.MeshStandardMaterial({color:0xa98f5c,metalness:1,roughness:.3,envMapIntensity:1.3}),
  text:new THREE.MeshStandardMaterial({transparent:true,metalness:.85,roughness:.28,envMapIntensity:1.3,depthWrite:false})
}};
NE.label=function(){
  var c=document.createElement("canvas");c.width=1200;c.height=1500;var x=c.getContext("2d");x.scale(1.5,1.5);
  var g=x.createLinearGradient(0,250,0,780);g.addColorStop(0,"#efe0b8");g.addColorStop(.5,"#cdb07a");g.addColorStop(1,"#957a48");
  x.fillStyle=g;x.strokeStyle=g;x.globalAlpha=.92;x.textAlign="center";x.textBaseline="middle";
  function ls(v){if("letterSpacing" in x)x.letterSpacing=v}
  x.font="600 150px 'Bodoni Moda',Georgia,serif";ls("10px");x.fillText("NOIR",400,400);
  x.font="500 64px 'Bodoni Moda',Georgia,serif";ls("22px");x.fillText("EMERALD",411,515);
  x.lineWidth=2;x.beginPath();x.moveTo(250,590);x.lineTo(550,590);x.stroke();
  x.font="500 30px 'Bodoni Moda',Georgia,serif";ls("10px");x.fillText("EAU DE PARFUM",405,650);
  x.font="500 24px 'Bodoni Moda',Georgia,serif";ls("8px");x.fillText("POUR HOMME",404,700);

};
NE.rr=function(w,d,r){var s=new THREE.Shape(),x=-w/2,y=-d/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+d-r);s.quadraticCurveTo(x+w,y+d,x+w-r,y+d);
  s.lineTo(x+r,y+d);s.quadraticCurveTo(x,y+d,x,y+d-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s};
NE.block=function(w,d,r,h,bev,mat){
  var g=new THREE.ExtrudeGeometry(NE.rr(w,d,r),{depth:h,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:6,curveSegments:18});
  g.rotateX(-Math.PI/2);return new THREE.Mesh(g,mat)};
NE.bottle=function(M){
  var g=new THREE.Group();
  var sh=document.createElement("canvas");sh.width=sh.height=256;var sx=sh.getContext("2d"),sg=sx.createRadialGradient(128,128,8,128,128,128);
  sg.addColorStop(0,"rgba(0,0,0,.9)");sg.addColorStop(1,"rgba(0,0,0,0)");sx.fillStyle=sg;sx.fillRect(0,0,256,256);
  var shadow=new THREE.Mesh(new THREE.PlaneGeometry(4.4,3.2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sh),transparent:true,depthWrite:false}));
  shadow.rotation.x=-Math.PI/2;shadow.position.y=-.075;shadow.name="shadow";g.add(shadow);
  var core=NE.block(1.42,.86,.22,1.36,.05,M.ink);core.position.y=.5;g.add(core);
  var body=NE.block(1.7,1.12,.12,2.0,.06,M.glass);body.renderOrder=2;g.add(body);
  var neck=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.26,48),M.ink);neck.position.y=2.19;g.add(neck);
  var collar=new THREE.Mesh(new THREE.CylinderGeometry(.31,.31,.32,64),M.gold);collar.position.y=2.47;g.add(collar);
  var lip=new THREE.Mesh(new THREE.CylinderGeometry(.325,.325,.05,64),M.gold);lip.position.y=2.605;g.add(lip);
  var btn=new THREE.Group();btn.name="btn";btn.position.y=2.76;g.add(btn);
  var act=new THREE.Mesh(new THREE.CylinderGeometry(.235,.24,.25,64),M.gold);btn.add(act);
  var top=new THREE.Mesh(new THREE.CylinderGeometry(.215,.235,.025,64),M.gold);top.position.y=.137;btn.add(top);
  var na=-.7,nzl=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.02,32),M.goldSoft);
  nzl.rotation.z=Math.PI/2;nzl.rotation.y=na;nzl.position.set(Math.cos(na)*.24,.03,-Math.sin(na)*.24);btn.add(nzl);
  var hole=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.024,16),M.ink);hole.rotation.copy(nzl.rotation);hole.position.copy(nzl.position).multiplyScalar(1.02);hole.name="nozzle";btn.add(hole);
  hole.userData.dir=new THREE.Vector3(Math.cos(na),.22,-Math.sin(na)).normalize();
  var cap=NE.block(.98,.74,.14,.55,.05,M.cap);cap.position.y=2.66;cap.name="cap";g.add(cap);
  var panel=new THREE.Mesh(new THREE.PlaneGeometry(1.0,1.25),M.panel);panel.position.set(0,1.12,.624);g.add(panel);
  M.text.map=NE.label();NE.labelMats.push(M.text);
  var txt=new THREE.Mesh(new THREE.PlaneGeometry(1.0,1.25),M.text);txt.position.set(0,1.12,.628);txt.renderOrder=3;g.add(txt);
  return g;
};
/* mirrored copy under the floor, fading with depth: a glossy floor without a floor */
NE.reflect=function(model){
  var r=model.clone(true),cache=new Map();r.scale.y=-1;r.position.y=-.15;
  function fade(m){
    if(cache.has(m))return cache.get(m);
    var c=m.clone();c.transparent=true;c.depthWrite=false;c.side=THREE.DoubleSide;
    c.onBeforeCompile=function(s){
      s.vertexShader="varying float vWY;\n"+s.vertexShader.replace("#include <project_vertex>","#include <project_vertex>\nvWY=(modelMatrix*vec4(transformed,1.0)).y;");
      s.fragmentShader="varying float vWY;\n"+s.fragmentShader.replace("#include <dithering_fragment>","#include <dithering_fragment>\ngl_FragColor.a*=clamp(1.0+(vWY+0.1)/1.15,0.0,1.0)*0.32;");
    };
    c.customProgramCacheKey=function(){return "ne-fade"};
    if(NE.labelMats.indexOf(m)>-1)NE.labelMats.push(c);
    cache.set(m,c);return c;
  }
  r.traverse(function(o){if(o.name==="shadow"){o.visible=false;return}if(o.isMesh)o.material=fade(o.material)});
  return r;
};
NE.pose=function(root,o,press){
  var u=root.userData;if(!u.cap){u.cap=root.getObjectByName("cap");u.btn=root.getObjectByName("btn")}
  u.cap.position.set(-o*.55,2.66+o*.95,o*.1);u.cap.rotation.set(0,o*.7,o*.3);
  u.btn.position.y=2.76-press*.05;
};
NE.nozzle=function(model,pos,dir){var n=model.userData.nz||(model.userData.nz=model.getObjectByName("nozzle"));
  model.updateMatrixWorld(true);n.getWorldPosition(pos);dir.copy(n.userData.dir).transformDirection(model.matrixWorld)};
NE.mist=function(scene,pr){
  var N=2600,P=new Float32Array(N*3),V=new Float32Array(N*3),A=new Float32Array(N).fill(99),L=new Float32Array(N).fill(1),K=new Float32Array(N),
      S=new Float32Array(N),AL=new Float32Array(N),i0=0,pend=0;
  var g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(P,3));g.setAttribute("size",new THREE.BufferAttribute(S,1));g.setAttribute("alpha",new THREE.BufferAttribute(AL,1));
  var m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{pr:{value:pr}},
    vertexShader:"attribute float size;attribute float alpha;varying float vA;uniform float pr;void main(){vA=alpha;vec4 m=modelViewMatrix*vec4(position,1.0);gl_PointSize=min(size*(420.0/-m.z),3.2)*pr;gl_Position=projectionMatrix*m;}",
    fragmentShader:"varying float vA;void main(){float d=length(gl_PointCoord-.5)*2.0;float a=1.0-smoothstep(0.0,1.0,d);a*=a;gl_FragColor=vec4(.95,.92,.84,a*vA);}"});
  var pts=new THREE.Points(g,m);pts.frustumCulled=false;scene.add(pts);
  function emit(o,d){
    var i=i0;i0=(i0+1)%N;var sp=3.2+Math.random()*3.8,dx=d.x,dy=d.y,dz=d.z,l=1,cs=.16*sp;
    P[i*3]=o.x;P[i*3+1]=o.y;P[i*3+2]=o.z;
    V[i*3]=dx/l*sp+(Math.random()-.5)*cs;V[i*3+1]=dy/l*sp+(Math.random()-.5)*cs;V[i*3+2]=dz/l*sp+(Math.random()-.5)*cs;
    A[i]=0;L[i]=.6+Math.random()*1.1;
  }
  return{
    burst:function(){pend+=1100},
    update:function(dt,origin,dir){
      var k=Math.min(pend,dt*1900);for(var e=0;e<k;e++)emit(origin,dir);pend=Math.max(0,pend-dt*1900);
      for(var q=0;q<N;q++){var a=A[q];if(a>=L[q]){AL[q]=0;continue}
        a+=dt;A[q]=a;var f=a/L[q],dr=Math.pow(.1,dt);
        V[q*3]*=dr;V[q*3+1]=V[q*3+1]*dr+.3*dt;V[q*3+2]*=dr;
        P[q*3]+=V[q*3]*dt;P[q*3+1]+=V[q*3+1]*dt;P[q*3+2]+=V[q*3+2]*dt;
        S[q]=.045*(1.0-.35*f);AL[q]=Math.pow(1-f,1.7)*.7}
      g.attributes.position.needsUpdate=true;g.attributes.size.needsUpdate=true;g.attributes.alpha.needsUpdate=true;
    }
  };
};

/* ---------- hero: scroll story inside one sticky stage ---------- */
var hero=$("top"),stage=$("stage"),caps=[].slice.call(document.querySelectorAll(".hc")),bar=$("progbar"),nav=$("nav");
function heroP(){var r=hero.getBoundingClientRect(),span=Math.max(1,hero.offsetHeight-innerHeight);return{p:Math.min(1,Math.max(0,-r.top/span)),vis:r.bottom>0}}
var gl=null;
function start3D(){
  if(!window.THREE)throw new Error("three.js did not load");
  var cv=$("gl");
  var renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
  var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,1,.1,100);
  NE.env(renderer,scene);
  var M=NE.mats(),model=NE.bottle(M),refl=NE.reflect(model),holder=new THREE.Group();
  holder.add(model);holder.add(refl);scene.add(holder);
  var mist=NE.mist(scene,renderer.getPixelRatio()),nz=new THREE.Vector3(),nd=new THREE.Vector3();
  if(document.fonts&&document.fonts.load){document.fonts.load("600 100px 'Bodoni Moda'").then(function(){
    var t=NE.label();NE.labelMats.forEach(function(m){m.map=t;m.needsUpdate=true})}).catch(function(){})}
  var K=[{p:0,ry:.45,cz:10.6,ly:1.4,o:0},{p:.22,ry:2.9,cz:9.6,ly:1.6,o:0},{p:.42,ry:6.63,cz:7.4,ly:2.2,o:0},
         {p:.58,ry:6.83,cz:8.4,ly:2.55,o:1},{p:.84,ry:7.03,cz:8.6,ly:2.45,o:1},{p:1,ry:7.7,cz:10.4,ly:1.7,o:0}];
  function ease(t){return t*t*(3-2*t)}
  function target(p){var i=0;while(i<K.length-2&&p>K[i+1].p)i++;var a=K[i],b=K[i+1],t=ease(Math.min(1,Math.max(0,(p-a.p)/(b.p-a.p))));
    return{ry:a.ry+(b.ry-a.ry)*t,cz:a.cz+(b.cz-a.cz)*t,ly:a.ly+(b.ly-a.ly)*t,o:a.o+(b.o-a.o)*t}}
  var cur=target(0),mx=0,my=0,user=0,vel=0,dragging=false,lx=0,press=0,sprayed=false,t0=performance.now(),
      still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  stage.addEventListener("pointermove",function(e){var r=stage.getBoundingClientRect();mx=(e.clientX-r.left)/r.width-.5;my=(e.clientY-r.top)/r.height-.5;
    if(dragging){var dx=e.clientX-lx;lx=e.clientX;vel=dx/r.width*7;user+=vel}});
  stage.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;dragging=true;lx=e.clientX});
  addEventListener("pointerup",function(){dragging=false});addEventListener("pointercancel",function(){dragging=false});
  function size(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
  addEventListener("resize",size);size();
  function burst(){mist.burst();press=1}
  return{burst:burst,frame:function(p,dt,now){
    var tg=target(p),k=still?1:.09,aspect=camera.aspect,mob=aspect<.9;
    for(var n in tg)cur[n]+=(tg[n]-cur[n])*k;
    if(!dragging){user+=vel;vel*=.92}
    holder.rotation.y=cur.ry+user+(still?0:Math.sin((now-t0)/1700)*.05)+mx*.2;
    var cz=cur.cz*(mob?1.75:Math.max(1,1.3/aspect)),drop=mob?-1.15:0;
    camera.position.set(mx*.35,cur.ly+.55-my*.25+drop,cz);camera.lookAt(0,cur.ly+drop,0);
    var o=ease(Math.min(1,Math.max(0,cur.o)));
    press=Math.max(0,press-dt*5);NE.pose(model,o,press);NE.pose(refl,o,press);
    if(o>.97&&!sprayed){sprayed=true;burst()}if(o<.5)sprayed=false;
    NE.nozzle(model,nz,nd);mist.update(dt,nz,nd);
    renderer.render(scene,camera);
  }};
}
try{gl=start3D()}catch(err){
  gl=null;$("gl").hidden=true;$("fallback").hidden=false;
  var st=$("status");if(st)st.textContent="3D: "+(err&&err.message||err);
}
$("spray").onclick=function(){if(gl)gl.burst()};
var prev=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  var dt=Math.min(.05,(now-prev)/1000);prev=now;
  var h=heroP(),p=h.p;
  caps.forEach(function(c){var a=+c.getAttribute("data-from"),b=+c.getAttribute("data-to");c.classList.toggle("on",p>=a&&p<=b)});
  bar.style.width=(p*100).toFixed(2)+"%";
  nav.classList.toggle("solid",!h.vis||p>=.999);
  if(gl&&h.vis){try{gl.frame(p,dt,now)}catch(e){gl=null;$("status").textContent="3D: "+e.message}}
}
requestAnimationFrame(tick);
addEventListener("error",function(ev){var st=$("status");if(st&&!st.textContent)st.textContent="Error: "+ev.message});
})();
</script>
