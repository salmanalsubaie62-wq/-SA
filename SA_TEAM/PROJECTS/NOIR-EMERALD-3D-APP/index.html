[hidden]{display:none!important}
.world{position:fixed;inset:0;z-index:0;pointer-events:none;

  padding-bottom:6vh}
.bigword span{display:block}
.fb{display:none;position:absolute;left:50%;top:34%;width:min(40vw,240px);transform:translate(-50%,-50%);z-index:1}
.nogl .fb{display:block}

.logo{font-family:var(--f-head);font-weight:700;letter-spacing:.34em;font-size:14px;color:var(--gold-hi)}

main{counter-reset:s}
.copy{max-width:360px;min-width:0;border-top:1px solid var(--gold-lo);padding-top:18px}
.copy.l{margin-right:auto}.copy.r{margin-left:auto}.copy.c{margin-inline:auto;text-align:center}

/* ---------- scroll story: one keyframe per section ---------- */
var K=[{ry:.55,x:0,cz:8.6,ly:1.65,o:0},{ry:2.2,x:1.7,cz:8.2,ly:1.65,o:0},{ry:3.6,x:-1.7,cz:5.4,ly:2.75,o:0},
       {ry:6.2832,x:1.6,cz:7.1,ly:1.55,o:0},{ry:6.75,x:-1.6,cz:7.4,ly:2.8,o:1},{ry:7.9,x:1.7,cz:8.4,ly:1.9,o:1},{ry:9.0,x:-1.7,cz:8.6,ly:1.65,o:0}];
function ease(t){return t*t*(3-2*t)}
function target(){
  var max=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=Math.min(1,Math.max(0,scrollY/max));
  var f=p*(K.length-1),i=Math.min(K.length-2,Math.floor(f)),t=ease(f-i),a=K[i],b=K[i+1];
  function L(k){return a[k]+(b[k]-a[k])*t}
  return{ry:L("ry"),x:L("x"),cz:L("cz"),ly:L("ly"),o:L("o"),p:p};
}
/* ---------- spray mist: soft particles that leave the nozzle ---------- */
var N=480,mPos=new Float32Array(N*3),mVel=new Float32Array(N*3),mAge=new Float32Array(N).fill(99),mLife=new Float32Array(N).fill(1),
    mSize=new Float32Array(N),mAlpha=new Float32Array(N),mi=0,pend=0,press=0,lastBurst=-9999,nz=new THREE.Vector3();
var mg=new THREE.BufferGeometry();
mg.setAttribute("position",new THREE.BufferAttribute(mPos,3));mg.setAttribute("size",new THREE.BufferAttribute(mSize,1));mg.setAttribute("alpha",new THREE.BufferAttribute(mAlpha,1));
var mm=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{pr:{value:renderer.getPixelRatio()}},
  vertexShader:"attribute float size;attribute float alpha;varying float vA;uniform float pr;void main(){vA=alpha;vec4 m=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*(420.0/-m.z)*pr;gl_Position=projectionMatrix*m;}",
  fragmentShader:"varying float vA;void main(){float d=length(gl_PointCoord-.5)*2.0;float a=smoothstep(1.0,0.0,d);a*=a;gl_FragColor=vec4(.96,.9,.76,a*vA);}"});
var mist=new THREE.Points(mg,mm);mist.frustumCulled=false;scene.add(mist);
function burst(now){if(!parts)return;pend+=130;press=1;lastBurst=now}
window.__burst=burst;
function emit(mob){
  holder.updateMatrixWorld(true);nz.set(0,2.68,0);model.localToWorld(nz);
  var i=mi;mi=(mi+1)%N;
  var sp=2.4+Math.random()*1.6,dx=mob?.25:1,dy=.28,dz=.5,l=Math.hypot(dx,dy,dz);
  mPos[i*3]=nz.x;mPos[i*3+1]=nz.y+.05;mPos[i*3+2]=nz.z;
  mVel[i*3]=dx/l*sp+(Math.random()-.5)*.9;mVel[i*3+1]=dy/l*sp+(Math.random()-.5)*.7;mVel[i*3+2]=dz/l*sp+(Math.random()-.5)*.9;
  mAge[i]=0;mLife[i]=.9+Math.random()*1.1;
}
var cur=target(),mx=0,my=0,t0=performance.now(),still=matchMedia("(prefers-reduced-motion:reduce)").matches;
addEventListener("pointermove",function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function size(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener("resize",size);size();
var big=$("bigword");
var tPrev=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;
  var tg=target(),k=still?1:.085,aspect=innerWidth/innerHeight,mob=aspect<.9;
  for(var n in tg)cur[n]+=(tg[n]-cur[n])*k;
  holder.rotation.y=cur.ry+(still?0:Math.sin((now-t0)/1600)*.06)+mx*.25;
  holder.position.set(mob?0:cur.x*Math.min(1,aspect/1.6),0,0);
  var cz=cur.cz*(mob?1.55:Math.max(1,1.35/aspect));
  var drop=mob?-1.0:0;
  camera.position.set(mx*.4,cur.ly+.6+my*-.3+drop,cz);
  camera.lookAt(0,cur.ly+drop,0);
  big.style.opacity=String(Math.max(0,1-cur.p*5));
  if(parts){var o=ease(Math.min(1,Math.max(0,cur.o)));
    parts.cap.position.set(-o*.55,2.34+o*.9,o*.1);parts.cap.rotation.set(0,o*.7,o*.32);
    parts.btn.position.y=2.68-press*.05;press=Math.max(0,press-dt*5);
    if(o>.97&&!still&&now-lastBurst>3800&&!document.hidden)burst(now);
    var k2=Math.min(pend,dt*320);for(var e=0;e<k2;e++)emit(mob);pend=Math.max(0,pend-dt*320);
  }
  for(var q=0;q<N;q++){var a=mAge[q];if(a>=mLife[q]){mAlpha[q]=0;continue}
    a+=dt;mAge[q]=a;var f=a/mLife[q];
    mVel[q*3]*=.965;mVel[q*3+1]=mVel[q*3+1]*.965+.35*dt;mVel[q*3+2]*=.965;
    mPos[q*3]+=mVel[q*3]*dt;mPos[q*3+1]+=mVel[q*3+1]*dt;mPos[q*3+2]+=mVel[q*3+2]*dt;
    mSize[q]=.3+f*.75;mAlpha[q]=Math.pow(1-f,1.4)*.5}
  mg.attributes.position.needsUpdate=true;mg.attributes.size.needsUpdate=true;mg.attributes.alpha.needsUpdate=true;
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);

}
try{
  if(!window.THREE)throw new Error("three.js did not load");
  start3D();
}catch(err){
  document.documentElement.classList.add("nogl");
  var st=$("status");if(st)st.textContent="3D: "+(err&&err.message||err);
}
addEventListener("error",function(ev){var st=$("status");if(st&&!st.textContent)st.textContent="Error: "+ev.message});
})();
</script>
