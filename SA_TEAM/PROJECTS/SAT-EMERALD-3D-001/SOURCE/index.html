<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOIR EMERALD — معاينة ثلاثية الأبعاد</title>
<style>
  :root { --bg:#07100c; --fg:#e9efe9; --gold:#d9a441; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Cairo","Segoe UI",Tahoma,sans-serif; }
  #wrap { position:fixed; inset:0; }
  #hud { position:fixed; bottom:12px; inset-inline:0; text-align:center; font-size:12px; opacity:.8; pointer-events:none; }
  #hud b { color:var(--gold); letter-spacing:2px; }
  #fallback { display:none; position:fixed; inset:0; align-items:center; justify-content:center; text-align:center; padding:16px; }
</style>
</head>
<body>
<div id="wrap"></div>
<div id="hud"><b>NOIR EMERALD</b> · معاينة</div>
<div id="fallback">المعاينة تحتاج متصفح يدعم WebGL.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script>
(function () {
  var wrap = document.getElementById("wrap");
  if (!window.THREE || !window.WebGLRenderingContext) {
    document.getElementById("fallback").style.display = "flex";
    return;
  }
  var T = window.THREE;
  var renderer;
  try { renderer = new T.WebGLRenderer({ antialias: true, alpha: false }); }
  catch (e) { document.getElementById("fallback").style.display = "flex"; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x07100c, 1);
  wrap.appendChild(renderer.domElement);

  var scene = new T.Scene();
  scene.fog = new T.FogExp2(0x07100c, 0.08);
  var camera = new T.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0.6, 5.2);

  // إضاءة: ذهبية من الأعلى، وزمردية من الجوانب
  scene.add(new T.AmbientLight(0x20352a, 0.8));
  var gold = new T.PointLight(0xd9a441, 2.2, 12); gold.position.set(0, 3, 2); scene.add(gold);
  var green = new T.PointLight(0x2fbf71, 1.4, 12); green.position.set(-3, 0.5, -1); scene.add(green);

  // أرضية داكنة
  var floor = new T.Mesh(new T.CircleGeometry(4, 64), new T.MeshStandardMaterial({ color: 0x0c1a13, roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -1.1; scene.add(floor);

  // الزجاجة (تصميم بسيط من تصميمنا، لا يشبه أي علامة تجارية)
  var bottle = new T.Group();
  var glass = new T.Mesh(
    new T.BoxGeometry(1.1, 1.6, 0.6),
    new T.MeshPhysicalMaterial({ color: 0xd9a441, transmission: 0.5, roughness: 0.05, thickness: 0.4, transparent: true, opacity: 0.92 })
  );
  var liquid = new T.Mesh(
    new T.BoxGeometry(1.0, 1.25, 0.5),
    new T.MeshStandardMaterial({ color: 0xc8862a, emissive: 0x3a2206, roughness: 0.2 })
  );
  liquid.position.y = -0.15;
  var cap = new T.Mesh(new T.BoxGeometry(1.16, 0.5, 0.66), new T.MeshStandardMaterial({ color: 0x050505, roughness: 0.3, metalness: 0.2 }));
  cap.position.y = 1.05;
  var stripe = new T.Mesh(new T.BoxGeometry(0.16, 1.3, 0.66), new T.MeshStandardMaterial({ color: 0x050505, roughness: 0.4 }));
  stripe.position.set(0, 0.05, 0);
  bottle.add(glass, liquid, cap, stripe);
  scene.add(bottle);

  // بلورات زمردية تطفو
  var crystals = new T.Group();
  var cmat = new T.MeshPhysicalMaterial({ color: 0x2fbf71, transmission: 0.7, roughness: 0.1, transparent: true, opacity: 0.8 });
  for (var i = 0; i < 14; i++) {
    var c = new T.Mesh(new T.OctahedronGeometry(0.12 + Math.random() * 0.28, 0), cmat);
    var a = (i / 14) * Math.PI * 2;
    c.userData = { a: a, r: 1.8 + Math.random() * 1.2, y: -0.2 + Math.random() * 1.4, s: 0.15 + Math.random() * 0.2 };
    crystals.add(c);
  }
  scene.add(crystals);

  function resize() {
    var w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var t0 = performance.now();
  function frame(now) {
    var t = reduce ? 0 : (now - t0) / 1000;
    // الزجاجة تدور ببطء وتطفو
    bottle.rotation.y = t * 0.35;
    bottle.position.y = Math.sin(t * 0.8) * 0.06;
    // البلورات تدور حول الزجاجة
    crystals.children.forEach(function (c) {
      var u = c.userData;
      c.position.set(Math.cos(u.a + t * u.s) * u.r, u.y + Math.sin(t * 0.5 + u.a) * 0.1, Math.sin(u.a + t * u.s) * u.r * 0.6);
      c.rotation.y = t * 0.6;
    });
    // كاميرا مدارية هادئة
    camera.position.x = Math.sin(t * 0.15) * 0.6;
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    if (!reduce) requestAnimationFrame(frame); else renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
